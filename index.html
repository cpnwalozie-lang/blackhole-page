<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Black hole</title>
<style>
:root{--bg:#000;--fg:#8a8f99}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
#h{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));color:var(--fg);font:12px system-ui,sans-serif;text-align:center;pointer-events:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#card{pointer-events:auto;background:rgba(0,0,0,.72);border:1px solid #333a;border-radius:14px;padding:22px 26px;max-width:340px;text-align:center;color:#e8ebf2;font:15px/1.4 system-ui,sans-serif}
#card button{margin-top:12px;font:600 16px system-ui,sans-serif;padding:12px 22px;border-radius:10px;border:0;background:#4aa3ff;color:#001;cursor:pointer}
#msg{margin-top:10px;font-size:13px;color:#aab}
</style></head><body>
<canvas id="c"></canvas><div id="h">Click or tap to change colour</div>
<div id="ui"><div id="card"><div>Opening your black hole windows...</div><button id="go">Open 5 windows</button><div id="msg">If nothing opens, click anywhere on this page.</div></div></div>
<script>
const TAU=Math.PI*2,LV=48,R0=.34,RE=R0*.9,RH=.2,RIN=.62,ROUT=1.9,SINI=.15,G=.32,NB=56,TRAIL=10;
const PAL=[
[[0,0,0],[5,10,44],[28,78,190],[130,210,255],[255,255,255]],
[[0,0,0],[38,13,4],[190,80,16],[255,185,90],[255,248,230]],
[[0,0,0],[34,6,68],[150,30,160],[255,110,90],[255,245,200]],
[[0,0,0],[38,39,41],[91,93,97],[163,166,173],[240,244,255]]];
const FADE=[...Array(TRAIL)].map((_,k)=>Math.pow(.78,k));
const OMD=[...Array(NB)].map((_,b)=>1.5/Math.pow(RIN+(ROUT-RIN)*(b+.5)/NB,1.5));
const OMH=[...Array(NB)].map((_,b)=>3/(1+4*b/NB));
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let PW,PH,S,CX,CY,XM,YM,LUT,DISK,HALO,STARS,ORBS,JETS,img,buf,pal=0,T=0;
const rnd=Math.random,uni=(a,b)=>a+(b-a)*rnd();
const sstep=(a,b,v)=>{if(v<=a)return 0;if(v>=b)return 1;const u=(v-a)/(b-a);return u*u*(3-2*u)};
function setPal(i){pal=i;const st=[0,.16,.38,.68,1],c=PAL[i];LUT=[];
for(let n=0;n<=LV;n++){const v=Math.pow(n/LV,.85);let k=0;while(k<3&&v>st[k+1])k++;
const u=(v-st[k])/(st[k+1]-st[k]);LUT.push([0,1,2].map(m=>c[k][m]+(c[k+1][m]-c[k][m])*u))}}
function lens(x,y){const b2=x*x+y*y;if(b2<1e-8)return[0,-RE];const f=.5*(1+Math.sqrt(1+4*RE*RE/b2));return[x*f,y*f]}
function layers(){DISK=[];HALO=[];
for(let py=0;py<PH;py++){const y=(py+.5-CY)/S;
for(let px=0;px<PW;px++){const x=(px+.5-CX)/S,i=py*PW+px,d=Math.hypot(x,y),yd=y/SINI,rd=Math.hypot(x,yd);
if(rd>=RIN&&rd<=ROUT){let vis=1;if(y<0)vis=sstep(R0,R0+1.5/S,d);
if(vis>.02){const edge=sstep(RIN,RIN+.05,rd)*(1-sstep(ROUT-.7,ROUT,rd)),beam=.45+.55*(x/rd+1)/2,
gr=.78+.14*Math.sin(rd*85)+.08*Math.sin(rd*31+1.3),base=Math.pow(RIN/rd,.85)*edge*beam*gr*1.15*vis,
th=Math.atan2(yd,x),p1=3*th+7*rd,p2=8*th-11*rd;
DISK.push([i,base,Math.sin(p1),Math.cos(p1),Math.sin(p2),Math.cos(p2),Math.min(NB-1,Math.floor((rd-RIN)/(ROUT-RIN)*NB))])}}
if(d>=R0-.6/S){const cov=Math.min(1,Math.max(0,(d-R0)*S+.5)),sy=Math.abs(y)/d,ext=R0*(.22+.9*sy),
t=Math.max(0,(d-R0)/ext),glow=t<1?Math.pow(1-t,2.2):0,beam=.5+.5*(x/d+1)/2,gh=.8+.2*Math.sin(d*90+1),
ring=Math.exp(-Math.pow((d-R0*1.03)/(.9/S),2)),ring2=.3*Math.exp(-Math.pow((d-R0*1.14)/(1/S),2)),
fix=(ring+ring2)*(.75+.25*beam)*cov,base=glow*beam*.95*gh*cov;
if(base>.01||fix>.01){const th=Math.atan2(y,x),p1=2*th+5*d,p2=5*th-9*d;
HALO.push([i,base,fix,Math.sin(p1),Math.cos(p1),Math.sin(p2),Math.cos(p2),Math.min(NB-1,Math.floor(t*NB))])}}}}}
function newOrb(k){
if(k===0){const r=uni(.9,1.95),a=uni(0,TAU),sp=Math.sqrt(G/r)*uni(.92,1);
return{x:r*Math.cos(a),z:r*Math.sin(a),vx:-sp*Math.sin(a),vz:sp*Math.cos(a),dr:uni(.1,.2),k:0,tr:[],age:0}}
const a=uni(0,TAU),b=uni(.1,1)*(rnd()<.5?-1:1),h=a+Math.PI+Math.atan2(b,2.15);
return{x:2.15*Math.cos(a),z:2.15*Math.sin(a),vx:.85*Math.cos(h),vz:.85*Math.sin(h),dr:0,k:1,tr:[],age:0}}
function adv(o,dt){const n=Math.max(1,Math.floor(dt*90+.5)),h=dt/n;
for(let i=0;i<n;i++){const r2=o.x*o.x+o.z*o.z+.012,k=G*h/(r2*Math.sqrt(r2));o.vx-=o.x*k;o.vz-=o.z*k;
if(o.dr){const f=1-o.dr*h;o.vx*=f;o.vz*=f}o.x+=o.vx*h;o.z+=o.vz*h}return Math.hypot(o.x,o.z)}
function newJet(fresh){const y0=R0*1.04,y=fresh?y0+rnd()*(YM-y0):y0,u=Math.max(-1,Math.min(1,(rnd()+rnd()+rnd()-1.5)*.8));
return[rnd()<.5?-1:1,y,uni(.6,1.3),u,uni(0,TAU)]}
function reset(){ORBS=[];for(let i=0;i<146;i++){const k=i<110?0:1;let o=newOrb(k);o.age=2;
if(k===1)for(let n=Math.floor(rnd()*60);n>0;n--){const r=adv(o,.05);if(r<RH||r>2.7){o=newOrb(k);break}}
ORBS.push(o)}JETS=[...Array(64)].map(()=>newJet(true))}
function setup(){const w=innerWidth||document.documentElement.clientWidth||800,h=innerHeight||document.documentElement.clientHeight||450,px=Math.max(2,Math.round(Math.min(w,h)/150));
PW=Math.ceil(w/px);PH=Math.ceil(h/px);cv.width=PW;cv.height=PH;img=cx.createImageData(PW,PH);buf=new Float32Array(PW*PH);
S=Math.min(PH/2,PW/4);CX=PW/2;CY=PH/2;XM=PW/2/S+.25;YM=PH/2/S+.25;layers();
STARS=[];for(let i=0;i<60*XM*YM;i++){const r=rnd();STARS.push([uni(-XM,XM),uni(-YM,YM),r<.5?.3:r<.8?.5:r<.95?.75:1,uni(0,TAU),uni(.03,.09)])}
reset()}
function update(dt){
for(let i=0;i<ORBS.length;i++){let o=ORBS[i],r=adv(o,dt);
if(r<RH||r>2.7){o=ORBS[i]=newOrb(o.k);r=Math.hypot(o.x,o.z)}
o.age+=dt;const sy=o.z*SINI;let ax=o.x,ay=sy;if(o.z<0)[ax,ay]=lens(o.x,sy);
const heat=o.k===0?.5+.5*Math.min(1,Math.max(0,(1.9-r)/1.4)):.7+.3*Math.min(1,.7/r);
let v=heat*sstep(RH,RH+.14,r)*Math.min(1,o.age/.8);if(o.z<0&&ax*ax+ay*ay<R0*R0)v=0;
o.tr.push([ax,ay,v]);if(o.tr.length>TRAIL)o.tr.shift()}
for(let i=0;i<JETS.length;i++){const j=JETS[i];j[1]+=j[2]*dt;if(j[1]>YM)JETS[i]=newJet(false)}}
function seg(x0,y0,x1,y1,v0,v1){let n=Math.floor(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))+1;if(n>16)n=1;
for(let k=0;k<=n;k++){const u=k/n,px=Math.floor(x0+(x1-x0)*u),py=Math.floor(y0+(y1-y0)*u);
if(px>=0&&px<PW&&py>=0&&py<PH){const j=py*PW+px,v=v0+(v1-v0)*u;if(v>buf[j])buf[j]=v}}}
function frame(T){buf.fill(0);const wrap=2*XM;
for(const[sx,sy,br,ph,sp]of STARS){const x=(((sx-sp*T+XM)%wrap)+wrap)%wrap-XM,[ax,ay]=lens(x,sy);
if(ax*ax+ay*ay<R0*R0)continue;const px=Math.floor(CX+ax*S),py=Math.floor(CY+ay*S);
if(px>=0&&px<PW&&py>=0&&py<PH){const v=br*(.72+.28*Math.sin(T*2.6+ph)),j=py*PW+px;if(v>buf[j])buf[j]=v;
if(br>.9)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const qx=px+dx,qy=py+dy;
if(qx>=0&&qx<PW&&qy>=0&&qy<PH){const k=qy*PW+qx;if(v*.45>buf[k])buf[k]=v*.45}}}}
let c1=OMH.map(w=>Math.cos(w*T)),s1=OMH.map(w=>Math.sin(w*T)),c2=OMH.map(w=>Math.cos(w*T*1.8)),s2=OMH.map(w=>Math.sin(w*T*1.8));
const rp=.92+.08*Math.sin(T*1.7);
for(const[j,base,fix,a1,b1,a2,b2,r]of HALO){let v=base*(.56+.28*(a1*c1[r]-b1*s1[r])+.16*(a2*c2[r]-b2*s2[r]));
const f=fix*rp;if(f>v)v=f;if(v>.004){const a=Math.min(1,v*2.5);buf[j]=v+buf[j]*(1-a)}}
c1=OMD.map(w=>Math.cos(w*T));s1=OMD.map(w=>Math.sin(w*T));c2=OMD.map(w=>Math.cos(w*T*2.3));s2=OMD.map(w=>Math.sin(w*T*2.3));
for(const[j,base,a1,b1,a2,b2,r]of DISK){const v=base*(.56+.28*(a1*c1[r]-b1*s1[r])+.16*(a2*c2[r]-b2*s2[r]));
if(v>.004){const a=Math.min(1,v*2.5);buf[j]=v+buf[j]*(1-a)}}
for(const o of ORBS){const tr=o.tr,last=tr.length-1;let prev=null;
for(let k=last;k>=0;k--){let[ax,ay,v]=tr[k];if(v<=0){prev=null;continue}v*=FADE[last-k];
const x1=CX+ax*S,y1=CY+ay*S;if(!prev)seg(x1,y1,x1,y1,v,v);else seg(prev[0],prev[1],x1,y1,prev[2],v);prev=[x1,y1,v]}}
const y0=R0*1.04;
for(const[s,y,vj,u,ph]of JETS){const flick=.65+.35*Math.sin(ph+T*11);
for(let k=0;k<6;k++){const yk=y-vj*.022*k,d=yk-y0;if(d<0)break;
let v=.95*Math.pow(Math.max(0,1-yk/YM),.7)*flick*Math.pow(.7,k);v*=Math.min(1,.2+d/.1);
const px=Math.floor(CX+u*(.012+.07*d)*S),py=Math.floor(CY+s*yk*S);
if(px>=0&&px<PW&&py>=0&&py<PH){const j=py*PW+px;if(v>buf[j])buf[j]=v}}}
const dta=img.data;
for(let i=0;i<buf.length;i++){const v=buf[i],c=LUT[v>=1?LV:Math.max(0,Math.floor(v*LV)||0)],p=i*4;dta[p]=c[0];dta[p+1]=c[1];dta[p+2]=c[2];dta[p+3]=255}
cx.putImageData(img,0,0)}
let last=performance.now(),rt;
function loop(now){const dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;T+=dt;try{update(dt);frame(T)}catch(e){document.getElementById('h').textContent='Error: '+e.message}requestAnimationFrame(loop)}

const POP=/[?&]w=1/.test(location.search);
if(POP){document.getElementById('ui').style.display='none';document.getElementById('h').style.display='none'}
let done=false;
function openAll(auto){const n=5,base=location.href.split('?')[0].split('#')[0]+'?w=1',ws=[],m=document.getElementById('msg');
for(let i=0;i<n;i++){const w=window.open(base,'bh'+i+'_'+Date.now(),'popup=yes,width=520,height=330,left='+(40+100*i)+',top='+(40+80*i));if(w)ws.push(w)}
if(ws.length<n){if(auto)ws.forEach(w=>{try{w.close()}catch(e){}});
m.textContent=auto?'Your browser needs one click first. Click anywhere to open the windows.':'Your browser blocked '+(n-ws.length)+' of the windows. Click the pop-up icon in the address bar, choose Always allow, then click again.';return false}
done=true;m.textContent='Done. Close each window when you are finished.';return true}
document.getElementById('go').onclick=e=>{e.stopPropagation();openAll(false)};
if(!POP){
addEventListener('load',()=>setTimeout(()=>{openAll(true)},300));
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!done)openAll(false)}));}
cv.addEventListener('click',()=>setPal((pal+1)%PAL.length));
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setup,200)});
setPal(0);setTimeout(()=>{try{setup()}catch(e){document.getElementById('h').textContent='Error: '+e.message}requestAnimationFrame(loop)},50);
</script></body></html>
